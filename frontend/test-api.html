<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test API - LUXE Store</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .test { background: white; padding: 15px; margin: 10px 0; border-radius: 5px; }
    .success { border-left: 4px solid #4caf50; }
    .error { border-left: 4px solid #f44336; }
    button { padding: 10px 20px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🔍 Diagnóstico de API</h1>
  <button onclick="testearTodo()">Probar Todo</button>
  <button onclick="testearBackend()">1. Backend</button>
  <button onclick="testearProductos()">2. Productos</button>
  <button onclick="testearCategorias()">3. Categorías</button>
  <button onclick="testearDestacados()">4. Destacados</button>
  
  <div id="resultados"></div>

  <script>
    const API_URL = 'http://localhost:3000';
    const resultados = document.getElementById('resultados');

    function log(mensaje, tipo = 'info') {
      const div = document.createElement('div');
      div.className = `test ${tipo}`;
      div.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${mensaje}`;
      resultados.appendChild(div);
    }

    async function testearBackend() {
      log('Probando conexión al backend...', 'info');
      try {
        const res = await fetch(API_URL + '/salud');
        if (res.ok) {
          log('✅ Backend está corriendo en ' + API_URL, 'success');
          return true;
        } else {
          log('❌ Backend responde pero con error: ' + res.status, 'error');
          return false;
        }
      } catch (error) {
        log('❌ Backend NO está corriendo. Error: ' + error.message, 'error');
        log('💡 Ejecuta: cd backend && npm start', 'error');
        return false;
      }
    }

    async function testearProductos() {
      log('Probando endpoint de productos...', 'info');
      try {
        const res = await fetch(API_URL + '/api/productos');
        const data = await res.json();
        if (res.ok && data.productos) {
          log(`✅ Productos cargados: ${data.productos.length} productos encontrados`, 'success');
          console.log('Productos:', data.productos);
          return true;
        } else {
          log('❌ Error al cargar productos: ' + (data.error || 'Sin datos'), 'error');
          return false;
        }
      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
        return false;
      }
    }

    async function testearCategorias() {
      log('Probando endpoint de categorías...', 'info');
      try {
        const res = await fetch(API_URL + '/api/productos/categorias');
        const data = await res.json();
        if (res.ok && data.categorias) {
          log(`✅ Categorías cargadas: ${data.categorias.length} categorías`, 'success');
          console.log('Categorías:', data.categorias);
          return true;
        } else {
          log('❌ Error al cargar categorías', 'error');
          return false;
        }
      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
        return false;
      }
    }

    async function testearDestacados() {
      log('Probando endpoint de destacados...', 'info');
      try {
        const res = await fetch(API_URL + '/api/productos/destacados');
        const data = await res.json();
        if (res.ok && data.productos) {
          log(`✅ Destacados cargados: ${data.productos.length} productos`, 'success');
          console.log('Destacados:', data.productos);
          return true;
        } else {
          log('❌ Error al cargar destacados', 'error');
          return false;
        }
      } catch (error) {
        log('❌ Error: ' + error.message, 'error');
        return false;
      }
    }

    async function testearTodo() {
      resultados.innerHTML = '';
      log('🚀 Iniciando diagnóstico completo...', 'info');
      
      const backendOk = await testearBackend();
      if (!backendOk) {
        log('⚠️ Deteniendo pruebas. Primero inicia el backend.', 'error');
        return;
      }
      
      await testearCategorias();
      await testearProductos();
      await testearDestacados();
      
      log('✅ Diagnóstico completado', 'success');
    }
  </script>
</body>
</html>
